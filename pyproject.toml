[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cudatracker"
version = "0.1.0"
description = "Jetson/CUDA object detection and tracking with stage-level timing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "opencv-python>=4.8", "PyYAML>=6.0"]

[project.scripts]
cudatracker = "cudatracker.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
