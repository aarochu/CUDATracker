# CI: lint, Python tests (Linux + Windows), C++ CPU build, and CUDA kernels +
# TensorRT backend compiled against real CUDA 12.9 / 13.4 and TensorRT headers.
# No GPU on hosted runners, so GPU tests skip and the CUDA job compiles only.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.14
      - run: ruff check --output-format=github .

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ["3.9", "3.12", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install numpy opencv-python-headless PyYAML pytest
      - run: python -m pytest -q

  cpp:
    name: c++ (gcc, cpu)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF
      - run: cmake --build build -j "$(nproc)"
      - run: ./build/cudatracker --help

  cuda:
    name: c++ (cuda ${{ matrix.cuda }}, tensorrt headers)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # 12.9 covers the pre-CUDA-13 arch list (sm_72, JetPack 5/6 era); 13.4 the current one.
        cuda: ["12.9", "13.4"]
    steps:
      - uses: actions/checkout@v7
      - name: Install nvcc, TensorRT headers, and OpenCV
        run: |
          ver="${{ matrix.cuda }}"
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          trt="$(apt-cache madison libnvinfer-headers-dev | awk '{print $3}' | grep -m1 -E "\+cuda${ver//./\\.}\$")"
          test -n "$trt"
          echo "TensorRT headers ${trt}"
          sudo apt-get install -y --no-install-recommends \
            "cuda-nvcc-${ver/./-}" "cuda-cudart-dev-${ver/./-}" "libnvinfer-headers-dev=${trt}" libopencv-dev
      - name: Configure
        # The TensorRT runtime package is ~2 GB, so link by name and compile ct_core without linking.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=ON -DWITH_TENSORRT=ON
          -DCMAKE_CUDA_COMPILER=/usr/local/cuda-${{ matrix.cuda }}/bin/nvcc
          -DTENSORRT_LIB=nvinfer
      - name: Compile kernels and the TensorRT backend
        run: cmake --build build --target ct_core -j "$(nproc)"
