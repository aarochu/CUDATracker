# Official matrix. Visualization off. Same clip for every cell.
input:
  source: samples/vtest.avi
  gstreamer: false

model:
  name: yolov8n
  weights: models/yolov8n.pt
  onnx: models/yolov8n.onnx
  engine_fp32: models/yolov8n_fp32.engine
  engine_fp16: models/yolov8n_fp16.engine
  imgsz: 640
  conf: 0.25
  iou: 0.45

tracker:
  type: sort
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3

visualization:
  enabled: false
  trails: false
  hud: false
  hardware_panel: false

telemetry:
  hardware: true

benchmark:
  warmup_frames: 50
  measure_frames: 300
  results_dir: benchmarks/results

matrix:
  preprocess: [cpu, cuda]
  backend: [pytorch, onnx, tensorrt]
  precision: [fp32, fp16]
  resolution: [640x480, 1280x720, 1920x1080]
  model: [yolov8n]
