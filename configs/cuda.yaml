# CUDA preprocess, same detector as cpu.yaml so the pair is comparable.
input:
  source: samples/vtest.avi
  resolution: 640x480
  fps_cap: 0
  gstreamer: false

preprocess:
  backend: cuda
  letterbox: true
  pad_value: 114
  fused: false

model:
  name: yolov8n
  weights: models/yolov8n.pt
  onnx: models/yolov8n.onnx
  engine: models/yolov8n_fp16.engine
  imgsz: 640
  conf: 0.25
  iou: 0.45

inference:
  backend: pytorch
  precision: fp32
  device: gpu

tracker:
  type: sort
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3

visualization:
  enabled: true
  trails: true
  hud: true
  hardware_panel: false

telemetry:
  hardware: true

benchmark:
  warmup_frames: 50
  measure_frames: 300

output:
  video: ""
  metrics: ""
